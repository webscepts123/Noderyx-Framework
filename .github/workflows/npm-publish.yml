name: Publish package to npm

on:
  # Publishing a GitHub release stays the normal route.
  release:
    types: [published]

  # Actions > Publish package to npm > Run workflow, for when a tag exists but
  # no release was published for it. Typing the version is the safety catch.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the v (for example 0.6.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing requires npm 11.5.1 or newer. Pinning the minimum
      # supported version keeps the release environment deterministic.
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11.5.1

      # A release publishes whatever its tag points at; a manual run publishes
      # the checked-out default branch. Both must match package.json exactly.
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          node -e "
          const { version } = require('./package.json');
          const { EVENT, RELEASE_TAG, MANUAL_VERSION } = process.env;
          const supplied = EVENT === 'workflow_dispatch' ? MANUAL_VERSION : RELEASE_TAG;
          const expected = EVENT === 'workflow_dispatch' ? version : 'v' + version;
          if (supplied !== expected) {
            console.error('package.json is ' + version + ', but this run asked for ' + supplied + '. Expected ' + expected + '.');
            process.exit(1);
          }
          console.log('Publishing ' + version + ' from ' + EVENT + '.');
          "

      - name: Install exact dependencies
        run: npm ci

      - name: Run framework tests
        run: npm test

      - name: Run lightweight QA audit
        run: npm run qa

      - name: Verify package contents
        run: npm pack --dry-run

      # No NPM_TOKEN is used. npm exchanges GitHub's short-lived OIDC token
      # through the Trusted Publisher configured on npmjs.com.
      - name: Publish to npm
        run: npm publish --access public
