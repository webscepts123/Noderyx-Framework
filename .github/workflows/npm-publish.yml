name: Publish package to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing requires npm 11.5.1 or newer. Pinning the minimum
      # supported version keeps the release environment deterministic.
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11.5.1

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "const p=require('./package.json'); if (process.env.RELEASE_TAG !== 'v' + p.version) { console.error('Release tag must be v' + p.version); process.exit(1) }"

      - name: Install exact dependencies
        run: npm ci

      - name: Run framework tests
        run: npm test

      - name: Run lightweight QA audit
        run: npm run qa

      - name: Verify package contents
        run: npm pack --dry-run

      # No NPM_TOKEN is used. npm exchanges GitHub's short-lived OIDC token
      # through the Trusted Publisher configured on npmjs.com.
      - name: Publish to npm
        run: npm publish --access public
